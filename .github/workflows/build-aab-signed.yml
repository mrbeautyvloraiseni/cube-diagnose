name: Build Signed Cube Diagnose AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build AAB
        run: gradle :app:bundleDebug

      - name: Create signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore cube-diagnose.jks \
            -storepass CubeDiagnose2026 \
            -keypass CubeDiagnose2026 \
            -alias cube-diagnose \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=MR Beauty Cube Diagnose, OU=MR Beauty, O=MR Beauty, L=Regensdorf, ST=ZH, C=CH"

      - name: Sign AAB
        run: |
          jarsigner \
            -keystore cube-diagnose.jks \
            -storepass CubeDiagnose2026 \
            -keypass CubeDiagnose2026 \
            app/build/outputs/bundle/debug/app-debug.aab \
            cube-diagnose

      - name: Verify signature
        run: jarsigner -verify -verbose -certs app/build/outputs/bundle/debug/app-debug.aab

      - name: Rename signed AAB
        run: cp app/build/outputs/bundle/debug/app-debug.aab Cube-Diagnose-1.0.0-signed.aab

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: Cube-Diagnose-SIGNED-AAB
          path: Cube-Diagnose-1.0.0-signed.aab
