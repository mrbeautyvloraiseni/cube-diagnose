name: Build Signed Cube Diagnose AAB

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/build-aab-signed.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore permanent release keystore
        shell: bash
        run: |
          printf '%s' '${{ secrets.KEYSTORE_BASE64 }}' | base64 --decode > release-keystore.jks
          test -s release-keystore.jks

      - name: Verify permanent keystore
        shell: bash
        run: |
          keytool -list -v             -keystore release-keystore.jks             -storepass "$KEYSTORE_PASSWORD"             -alias "$KEY_ALIAS"

      - name: Build signed release AAB
        run: gradle :app:bundleRelease --stacktrace

      - name: Copy signed AAB
        shell: bash
        run: |
          AAB=$(find app/build/outputs/bundle/release -type f -name "*.aab" | head -1)
          test -n "$AAB"
          cp "$AAB" Cube-Diagnose-1.0.0-signed.aab

      - name: Verify AAB signature
        run: |
          jarsigner -verify -verbose -certs Cube-Diagnose-1.0.0-signed.aab

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: Cube-Diagnose-SIGNED-AAB
          path: Cube-Diagnose-1.0.0-signed.aab
          if-no-files-found: error
